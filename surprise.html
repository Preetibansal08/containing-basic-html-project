<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4f7">
    <title>Your Birthday Surprise!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            color: #512e50;
            background:
                radial-gradient(circle at 10% 18%, #ffd4df 0 7px, transparent 8px),
                radial-gradient(circle at 88% 24%, #ffe6a8 0 9px, transparent 10px),
                radial-gradient(circle at 17% 83%, #d8c8ff 0 8px, transparent 9px),
                linear-gradient(135deg, #fff8e9, #fff0f6 55%, #f2edff);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .card {
            width: min(100%, 700px);
            padding: clamp(28px, 7vw, 58px);
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 24px 70px rgba(111, 63, 103, 0.16);
            animation: arrive 700ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #a64e7b;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #8d3c75;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            line-height: 1.1;
        }

        .message {
            margin: 16px auto 26px;
            color: #705b70;
            font-size: 1.08rem;
            line-height: 1.7;
        }

        .birthday-gif {
            display: block;
            width: min(100%, 420px);
            height: auto;
            max-height: 320px;
            margin: 0 auto 28px;
            object-fit: cover;
            background: #fff0f6;
            border: 6px solid #fff;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(92, 48, 88, 0.16);
        }

        .back-link {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            color: #8d3c75;
            background: #fff2f8;
            border: 1px solid #f1d4e2;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: background 160ms ease, transform 160ms ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
            background: #ffe6f1;
        }

        .back-link:focus-visible {
            outline: 3px solid #6f3470;
            outline-offset: 4px;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">Surprise!</p>
        <h1>Let the birthday magic begin 🎉</h1>
        <p class="message">Sending you a little extra celebration and lots of birthday love!</p>
        <img
            class="birthday-gif"
            src="https://media.giphy.com/media/feio2yIUMtdqWjRiaF/giphy.gif"
            alt="A cheerful animated birthday celebration"
        >
        <a class="back-link" href="birthday.html">← Back to your birthday card</a>
    </main>
</body>
</html>
