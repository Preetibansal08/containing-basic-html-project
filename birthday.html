<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4f7">
    <title>Happy Birthday!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            overflow: hidden;
            color: #512e50;
            background:
                radial-gradient(circle at 12% 18%, #ffd4df 0 7px, transparent 8px),
                radial-gradient(circle at 84% 22%, #ffe6a8 0 9px, transparent 10px),
                radial-gradient(circle at 18% 82%, #d8c8ff 0 8px, transparent 9px),
                linear-gradient(135deg, #fff8e9, #fff0f6 55%, #f2edff);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .card {
            width: min(100%, 680px);
            padding: clamp(32px, 8vw, 72px) 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            box-shadow: 0 24px 70px rgba(111, 63, 103, 0.16);
            animation: arrive 700ms ease-out both;
        }

        .cake {
            display: block;
            margin-bottom: 18px;
            font-size: clamp(3rem, 11vw, 5rem);
            animation: bob 2.5s ease-in-out infinite;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #a64e7b;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #8d3c75;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.8rem, 10vw, 5.2rem);
            line-height: 1.05;
        }

        .message {
            max-width: 470px;
            margin: 20px auto 30px;
            color: #705b70;
            font-size: clamp(1rem, 3vw, 1.2rem);
            line-height: 1.7;
        }

        .surprise-link {
            display: inline-flex;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            color: #fff;
            background: linear-gradient(135deg, #d65f91, #a64786);
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(166, 71, 134, 0.25);
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .surprise-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(166, 71, 134, 0.32);
        }

        .surprise-link:focus-visible,
        .back-link:focus-visible {
            outline: 3px solid #6f3470;
            outline-offset: 4px;
        }

        .hint {
            margin: 18px 0 0;
            color: #977d93;
            font-size: 0.9rem;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bob {
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="cake" aria-hidden="true">🎂</span>
        <p class="eyebrow">A little celebration just for you</p>
        <h1>Happy Birthday!</h1>
        <p class="message">
            May your day be full of big smiles, sweet surprises, and all the things
            that make you happiest. You deserve a wonderful year ahead!
        </p>
        <a class="surprise-link" href="surprise.html">
            Open your surprise <span aria-hidden="true">💌</span>
        </a>
        <p class="hint">Go on — there's one more birthday treat!</p>
    </main>
</body>
</html>
